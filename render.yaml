# Render deployment configuration for TrustGuard AI
# https://render.com/docs/yaml-spec
services:
  - type: web
    name: trustguard-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn asgi:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CORS_ORIGINS
        value: "https://trustguard-ai-jet.vercel.app,http://localhost:5173"
      - key: ENVIRONMENT
        value: "production"
